name: Worthing Price Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4
          playwright install chromium --with-deps

      - name: Run Scraper
        env:
          UK_PROXY_SERVER: ${{ secrets.UK_PROXY_SERVER }}
          UK_PROXY_USERNAME: ${{ secrets.UK_PROXY_USERNAME }}
          UK_PROXY_PASSWORD: ${{ secrets.UK_PROXY_PASSWORD }}
        run: python scraper.py

      # Upload the dumped card HTML files as a downloadable zip artifact
      - name: Upload Debug Card Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-cards-html
          path: debug_cards/
